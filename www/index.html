<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>AI Camera Pro</title>
<link rel="stylesheet" href="app.css">
</head>
<body>

<div id="app">
  <!-- 頂部列 -->
  <header class="topbar">
    <button class="icon-btn" id="btnSettings" aria-label="設定">⚙</button>
    <button class="chip" id="btnHdr" aria-label="HDR 開關">HDR 關</button>
    <button class="icon-btn" id="btnLight" aria-label="閃光燈">🚫</button>
    <div class="grow"></div>
    <div id="lensTag" class="tag">—</div>
  </header>

  <!-- 取景 -->
  <main class="stage" id="stage">
    <div class="frame" id="frame">
      <video id="video" autoplay playsinline muted></video>
      <div id="reticle"></div>
    </div>
    <div id="zoomBadge" class="zoom-badge">1.0×</div>
  </main>

  <!-- 鏡頭與變焦 -->
  <section class="lens-area">
    <input type="range" id="zoomRange" min="0" max="100" step="0.5" value="26.4" aria-label="變焦">
    <div class="lens-row" id="lensRow"></div>
  </section>

  <!-- 專業控制(EV / 手動對焦) -->
  <section class="pro-panel" id="proPanel" hidden>
    <div class="slider-row">
      <span class="lbl">EV</span>
      <input type="range" id="evRange" min="-3" max="3" step="0.1" value="0">
      <span class="val" id="evVal">0.0</span>
    </div>
    <div class="slider-row">
      <button class="mini" id="btnFocusMode">AF</button>
      <input type="range" id="focusRange" min="0" max="100" step="1" value="0" disabled>
      <span class="val" id="focusVal">自動</span>
    </div>
  </section>

  <!-- 快門列 -->
  <footer class="shutter-bar">
    <button class="thumb" id="btnThumb" aria-label="開啟相簿"><img id="thumbImg" alt=""></button>
    <button class="shutter" id="btnShutter" aria-label="拍照"><span></span></button>
    <button class="icon-btn big" id="btnPro" aria-label="專業控制">◐</button>
  </footer>
</div>

<!-- 檢視器 -->
<div id="viewer" class="overlay" hidden>
  <div class="viewer-top">
    <button class="icon-btn" id="vClose" aria-label="關閉">✕</button>
    <div class="grow viewer-info" id="vInfo">—</div>
    <button class="icon-btn" id="vPrev" aria-label="上一張">‹</button>
    <button class="icon-btn" id="vNext" aria-label="下一張">›</button>
  </div>
  <div class="viewer-stage" id="vStage">
    <div class="viewer-content" id="vContent">
      <img id="vBase" alt="">
      <img id="vTile" alt="">
    </div>
    <div class="viewer-hint" id="vHint">雙指縮放、雙擊放大;放大後會自動載入原生像素</div>
  </div>
  <div class="viewer-actions">
    <button class="act" id="vUpscale">🔍 放大至 1 億畫素</button>
    <button class="act accent" id="vGemini">✨ Gemini 4K 回推</button>
  </div>
</div>

<!-- 設定頁 -->
<div id="settings" class="overlay" hidden>
  <div class="settings-top">
    <button class="icon-btn" id="sClose" aria-label="返回">‹</button>
    <h1>設定</h1>
  </div>
  <div class="settings-body">

    <section class="card">
      <h2>Gemini AI 回推</h2>
      <label class="field">
        <span>API Key</span>
        <div class="inline">
          <input type="password" id="setKey" placeholder="貼上 Gemini API key" autocomplete="off" autocapitalize="off" spellcheck="false">
          <button class="mini" id="btnShowKey" type="button">顯示</button>
        </div>
        <small>金鑰只存放在本機,送出影像時會直接傳給 Google。</small>
      </label>
      <div class="inline">
        <button class="act small" id="btnTestKey" type="button">測試金鑰</button>
        <span id="testResult" class="test-result"></span>
      </div>
      <label class="field">
        <span>模型</span>
        <select id="setModel">
          <option value="gemini-nano-banana-2.1">Nano Banana 2.1(gemini-nano-banana-2.1,預設)</option>
          <option value="gemini-3-pro-image">Nano Banana Pro(gemini-3-pro-image)</option>
          <option value="gemini-3.1-flash-image">Nano Banana 2(gemini-3.1-flash-image)</option>
          <option value="__custom">自訂模型 ID…</option>
        </select>
        <input type="text" id="setModelCustom" placeholder="輸入模型 ID" hidden>
      </label>
      <label class="field">
        <span>輸出解析度(上限 4K)</span>
        <select id="setSize">
          <option value="1K">1K</option>
          <option value="2K">2K</option>
          <option value="4K">4K</option>
        </select>
      </label>
      <label class="field">
        <span>送出前縮小到(長邊像素)</span>
        <select id="setMaxInput">
          <option value="1536">1536</option>
          <option value="2048">2048</option>
          <option value="3072">3072</option>
        </select>
      </label>
      <label class="switch">
        <input type="checkbox" id="setAuto"><span>數位變焦拍攝後自動回推</span>
      </label>
      <label class="field">
        <span>自動回推門檻(數位變焦倍率 ≥)</span>
        <input type="number" id="setThreshold" min="1" max="10" step="0.1">
        <small>數位倍率 = 目前變焦 ÷ 所用鏡頭的光學倍率,例如 2x 望遠上拍 5×,數位倍率為 2.5。</small>
      </label>
      <label class="field">
        <span>回推提示詞</span>
        <textarea id="setPrompt" rows="6"></textarea>
        <button class="mini" id="btnResetPrompt" type="button">還原預設</button>
      </label>
      <p class="note">AI 回推是由模型依畫面推測並合成細節,結果可能與實際景物有出入(文字、人臉、紋理尤其如此),不適合用於需要如實記錄的場合。</p>
    </section>

    <section class="card">
      <h2>HDR 合成</h2>
      <label class="switch">
        <input type="checkbox" id="setHdrOn"><span>預設開啟 HDR</span>
      </label>
      <label class="field">
        <span>合成張數</span>
        <select id="setHdrCount">
          <option value="3">3 張</option>
          <option value="5">5 張</option>
          <option value="7">7 張</option>
          <option value="9">9 張</option>
        </select>
      </label>
      <label class="field">
        <span>EV 範圍(±)</span>
        <select id="setHdrRange">
          <option value="0.5">±0.5 EV</option>
          <option value="1">±1 EV</option>
          <option value="1.5">±1.5 EV</option>
          <option value="2">±2 EV</option>
          <option value="2.5">±2.5 EV</option>
          <option value="3">±3 EV</option>
        </select>
        <small>各張 EV 會在 −範圍 ~ +範圍 間等距分佈,並自動限制在鏡頭支援的曝光補償範圍內。</small>
      </label>
      <label class="field">
        <span>每張曝光穩定等待(毫秒)</span>
        <input type="number" id="setSettle" min="200" max="2000" step="50">
      </label>
      <p class="note">HDR 為手持連拍合成,畫面移動會產生殘影,建議靠穩或使用腳架。</p>
    </section>

    <section class="card">
      <h2>輸出</h2>
      <label class="field">
        <span>JPEG 品質:<b id="qVal">95</b></span>
        <input type="range" id="setQuality" min="80" max="100" step="1">
      </label>
      <label class="field">
        <span>放大目標</span>
        <select id="setMP">
          <option value="100">1 億畫素(100 MP)</option>
          <option value="75">7,500 萬畫素</option>
          <option value="50">5,000 萬畫素</option>
        </select>
        <small>若手機記憶體不足會自動降級到較小的畫素。放大為插值演算,不會憑空增加真實細節;想要更多細節請先用 Gemini 回推。</small>
      </label>
    </section>

    <section class="card">
      <h2>鏡頭對應</h2>
      <label class="field">
        <span>廣角(0.5×)</span>
        <select id="mapWide"></select>
      </label>
      <label class="field">
        <span>主鏡頭(1×)</span>
        <select id="mapMain"></select>
      </label>
      <label class="field">
        <span>望遠(2×,Note 10+)</span>
        <select id="mapTele"></select>
      </label>
      <div class="cam-list" id="camList"></div>
      <button class="act small" id="btnRescan" type="button">重新偵測鏡頭</button>
      <p class="note">部分 Samsung 機型只會把部分實體鏡頭開放給第三方 App。若望遠鏡頭未出現在清單,2× 會改用主鏡頭數位裁切。</p>
    </section>

    <section class="card">
      <h2>關於</h2>
      <p class="note" id="aboutText"></p>
    </section>
  </div>
</div>

<!-- 處理中 -->
<div id="hud" class="hud" hidden>
  <div class="spinner"></div>
  <div class="hud-main" id="hudMain">處理中…</div>
  <div class="hud-sub" id="hudSub"></div>
</div>

<div id="toast" class="toast" hidden></div>

<script src="app.js"></script>
</body>
</html>
